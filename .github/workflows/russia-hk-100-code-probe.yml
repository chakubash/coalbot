name: Russia-HK 100-code Trade-IDDS probe
on:
  push:
    branches: [research/russia-hk-trade-20260805]
    paths:
      - '.github/workflows/russia-hk-100-code-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-13
    timeout-minutes: 15
    env: {N: '100', PERIOD: '202501'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python research/russia_hk_probe_many_codes.py
      - uses: actions/upload-artifact@v4
        with:
          name: many-code-100-macos
          path: research/probe_many_codes/100
