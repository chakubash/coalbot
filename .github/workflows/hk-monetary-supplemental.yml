name: HK monetary supplemental data

on:
  push:
    branches: [research-hk-monetary-transmission]
    paths:
      - "research/hk_monetary_transmission/fetch_supplemental.py"
      - ".github/workflows/hk-monetary-supplemental.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python research/hk_monetary_transmission/fetch_supplemental.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hk-monetary-supplemental
          path: research_output/hk_monetary_supplemental
          if-no-files-found: error
          retention-days: 7
