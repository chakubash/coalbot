name: Russia-HK parallel edition-native extraction v3

on:
  push:
    branches:
      - research/russia-hk-trade-20260805
    paths:
      - '.github/workflows/russia-hk-data-fetch.yml'
      - 'research/russia_hk_parallel_extract.py'
      - 'research/patch_parallel_empty.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    strategy:
      fail-fast: false
      matrix:
        case:
          - A_import_origin_russia
          - B_import_consignment_russia
          - C_domestic_exports_russia
          - D_re_exports_russia
          - E_total_exports_russia
          - G_hk_world_imports
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas numpy
      - run: python research/patch_parallel_empty.py
      - run: python research/russia_hk_parallel_extract.py
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-${{ matrix.case }}-v3
          path: research/parallel_acquisition/${{ matrix.case }}
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
