name: Russia-HK Trade-IDDS fast probe

on:
  push:
    branches:
      - research/russia-hk-trade-20260805
    paths:
      - '.github/workflows/russia-hk-data-fetch.yml'
      - 'research/russia_hk_probe3.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install requests
      - name: Probe Trade-IDDS
        run: python research/russia_hk_probe3.py
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: russia-hk-probe3
          path: research/probe3_output
          if-no-files-found: error
          retention-days: 7
