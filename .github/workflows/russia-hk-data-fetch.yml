name: Russia-HK official data discovery

on:
  push:
    branches:
      - research/russia-hk-trade-20260805
    paths:
      - '.github/workflows/russia-hk-data-fetch.yml'
      - 'research/russia_hk_fetch.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install discovery dependencies
        run: pip install requests pypdf beautifulsoup4 pandas openpyxl
      - name: Fetch official endpoints
        run: python research/russia_hk_fetch.py
      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: russia-hk-discovery
          path: research/discovery_output
          if-no-files-found: error
          retention-days: 7
