name: Russia-HK Trade-IDDS extraction design probe

on:
  push:
    branches:
      - research/russia-hk-trade-20260805
    paths:
      - '.github/workflows/russia-hk-data-fetch.yml'
      - 'research/russia_hk_probe4.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  long1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: CASE=long1 python research/russia_hk_probe4.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe4-long1
          path: research/probe4_output/long1
