name: Russia-HK sequential parameter validation

on:
  push:
    branches:
      - research/russia-hk-trade-20260805
    paths:
      - '.github/workflows/russia-hk-data-fetch.yml'
      - 'research/russia_hk_probe6.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python research/russia_hk_probe6.py
      - uses: actions/upload-artifact@v4
        with:
          name: russia-hk-probe6
          path: research/probe6_output
          if-no-files-found: error
          retention-days: 7
