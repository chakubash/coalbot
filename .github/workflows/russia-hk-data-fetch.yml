name: Russia-HK official aggregate total audit

on:
  push:
    branches:
      - research/russia-hk-trade-20260805
    paths:
      - '.github/workflows/russia-hk-data-fetch.yml'
      - 'research/russia_hk_totals_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  totals-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas
      - run: python research/russia_hk_totals_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: russia-hk-totals-audit
          path: research/totals_audit
          if-no-files-found: error
          retention-days: 7
