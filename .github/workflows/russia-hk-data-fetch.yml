name: Russia-HK official data probe 2

on:
  push:
    branches:
      - research/russia-hk-trade-20260805
    paths:
      - '.github/workflows/russia-hk-data-fetch.yml'
      - 'research/russia_hk_probe2.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install discovery dependencies
        run: pip install requests beautifulsoup4
      - name: Probe official endpoints
        run: python research/russia_hk_probe2.py
      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: russia-hk-probe2
          path: research/discovery_output
          if-no-files-found: error
          retention-days: 7
