name: Russia-HK trade data acquisition

on:
  push:
    branches:
      - research/russia-hk-trade-data-20260806
    paths:
      - '.github/workflows/russia-hk-trade-data.yml'
      - 'research_tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tradeidds-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas openpyxl
      - name: Probe official Trade-IDDS API
        run: python research_tools/probe_tradeidds.py
      - uses: actions/upload-artifact@v4
        with:
          name: tradeidds-probe
          path: acquired/
          retention-days: 3
