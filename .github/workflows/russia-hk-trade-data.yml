name: Russia-HK trade data acquisition

on:
  push:
    branches:
      - research/russia-hk-trade-data-20260806
    paths:
      - '.github/workflows/russia-hk-trade-data.yml'
      - 'research_tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  references-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pandas openpyxl
      - name: Fetch official classification catalog and probe mirrors
        run: python research_tools/fetch_references_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: references-probe
          path: acquired/
          retention-days: 3
