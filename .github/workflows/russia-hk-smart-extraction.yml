name: Russia-HK smart official extraction v3
on:
  push:
    branches: [research/russia-hk-trade-20260805]
    paths:
      - '.github/workflows/russia-hk-smart-extraction.yml'
      - 'research/russia_hk_smart_extract.py'
      - 'research/patch_smart_calls.py'
      - 'research/patch_smart_identity.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    strategy:
      fail-fast: false
      matrix:
        case: [A_G, B, CDE]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests pandas numpy
      - run: python research/patch_smart_calls.py
      - run: python research/patch_smart_identity.py
      - run: python research/russia_hk_smart_extract.py
      - uses: actions/upload-artifact@v4
        with:
          name: smart-${{ matrix.case }}-v3
          path: research/smart_acquisition/${{ matrix.case }}
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
