name: Russia-HK official support data
on:
  push:
    branches: [research/russia-hk-trade-20260805]
    paths:
      - '.github/workflows/russia-hk-support-download.yml'
      - 'research/russia_hk_support_download.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python research/russia_hk_support_download.py
      - uses: actions/upload-artifact@v4
        with:
          name: russia-hk-official-support
          path: research/support_download
          if-no-files-found: error
          retention-days: 7
