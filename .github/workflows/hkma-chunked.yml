name: HKMA official chunked data

on:
  push:
    branches: [research-hk-monetary-transmission]
    paths:
      - ".github/scripts/fetch_hkma_chunked.py"
      - ".github/workflows/hkma-chunked.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas requests
      - run: python .github/scripts/fetch_hkma_chunked.py
      - name: Show assembled files
        if: always()
        run: |
          find research_output/hkma_official_chunked -maxdepth 2 -type f -printf '%p\t%k KB\n' | sort || true
          tail -n +1 research_output/hkma_official_chunked/manifest.csv || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hkma-official-chunked
          path: research_output/hkma_official_chunked
          if-no-files-found: error
          retention-days: 7
